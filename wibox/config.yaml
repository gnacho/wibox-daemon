name: Wibox Doorbell
version: "0.6.1"
slug: wibox
description: Opens the Fermax Wi-Box doorbell through the vendor cloud
url: https://github.com/gnacho/wibox-daemon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  8087/tcp: 8087
  8556/tcp: 8556
ports_description:
  8087/tcp: HTTP API for rest_command and sensors
  8554/tcp: RTSP stream for Home Assistant
options:
  account: ""
  password: ""
  client_id: "003-2021-87dad215f30f1f7e"
  device_id: ""
  unlock_password: ""
  api_token: ""
  attempts: 20
  awake_poll: 45
  video_wait: 20
schema:
  account: str
  password: password
  client_id: str
  device_id: str
  unlock_password: password
  api_token: password
  attempts: int(1,500)
  awake_poll: int(1,300)
  video_wait: int(1,600)
