name: Wibox Doorbell
version: "0.10.50"
slug: wibox
description: Opens the Fermax Wi-Box doorbell through the vendor cloud
url: https://github.com/gnacho/wibox-daemon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
ports:
  8087/tcp: 8087
  8556/tcp: 8556
ports_description:
  8087/tcp: HTTP API for rest_command and sensors
  8556/tcp: RTSP stream for Home Assistant
# El supervisor reinicia el contenedor si /health deja de responder: es la
# unica forma de recuperar la API sin que el usuario entre a mirar.
watchdog: "http://[HOST]:[PORT:8087]/health"
options:
  account: ""
  password: ""
  client_id: "003-2021-87dad215f30f1f7e"
  device_id: ""
  unlock_password: ""
  api_token: ""
  attempts: 20
  awake_poll: 45
  video_wait: 20
  open_cooldown: 3
  video_retry: 5
  video_retry_max: 60
  remote_budget: 240
  video_start_timeout: 300
  ha_url: ""
  ha_token: ""
  ha_stream: ""
  cloud_check: 600
  video_max: 900
  play_resends: 3
  video_all_frames: false
  open_settle: 75
  trickle_ms: 20
  lock_wait: 300
schema:
  account: str
  password: password
  client_id: str
  device_id: str
  unlock_password: password
  api_token: password
  attempts: int(1,500)
  awake_poll: int(1,300)
  video_wait: int(1,600)
  open_cooldown: int(0,60)
  video_retry: int(1,300)
  video_retry_max: int(5,3600)
  remote_budget: int(10,3600)
  video_start_timeout: int(30,3600)
  ha_url: str
  ha_token: password
  ha_stream: str
  cloud_check: int(10,86400)
  video_max: int(0,86400)
  play_resends: int(0,50)
  video_all_frames: bool
  open_settle: int(0,600)
  trickle_ms: int(0,1000)
  lock_wait: int(0,3600)
