name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: tests with the race detector
        run: make race
      - name: coverage
        run: go test -count=1 -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -1
      - name: coverage floor
        # Lo ganado no se pierde: si la cobertura total baja del umbral, el job
        # falla. El numero se sube a mano cuando toque, no se baja.
        run: |
          total=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "cobertura total: ${total}%"
          awk "BEGIN{exit !($total >= 63)}" || { echo "por debajo del 63%"; exit 1; }
