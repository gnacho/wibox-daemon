name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: tests with the race detector
        run: go test -race -count=1 ./...
      - name: coverage
        run: go test -count=1 -coverprofile=cover.out ./... && go tool cover -func=cover.out | tail -1
