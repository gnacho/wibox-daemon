# Home Assistant: open the door with the daemon, without depending on the phone.
# Replace the IP and the token with your own.

rest_command:
  wibox_open:
    url: "http://192.168.1.50:8087/open?device=23123csfewyk"
    method: GET
    headers:
      Authorization: "Bearer CHANGE_ME"
    timeout: 30

sensor:
  - platform: rest
    name: Wibox
    resource: "http://192.168.1.50:8087/devices"
    headers:
      Authorization: "Bearer CHANGE_ME"
    value_template: >-
      {% set d = value_json.devices[0] if value_json.devices else None %}
      {{ 'online' if d else 'offline' }}
    json_attributes_path: "$.devices[0]"
    json_attributes:
      - id
      - name
      - model
    scan_interval: 60
